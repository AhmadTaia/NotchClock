<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; media-src 'self' mediastream:">
  <title>NotchClock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="budSilver" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#80858d"/><stop offset=".35" stop-color="#eceef1"/>
        <stop offset=".62" stop-color="#c4c8ce"/><stop offset="1" stop-color="#8b9098"/>
      </linearGradient>
      <linearGradient id="budTip" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7cad0"/>
      </linearGradient>
      <linearGradient id="caseLid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(235,240,246,.55)"/><stop offset="1" stop-color="rgba(200,206,214,.2)"/>
      </linearGradient>
      <symbol id="bud-shape" viewBox="0 0 24 40">
        <ellipse cx="7.6" cy="8.6" rx="5.2" ry="5.8" fill="url(#budTip)"/>
        <path d="M9 3.5c4.6-.6 9 2.2 9.6 6.6.4 2.6-.5 4.8-2.1 6.2H10.4C7.6 14.6 6 12 6.4 8.8 6.7 6 7.6 3.9 9 3.5z" fill="url(#budSilver)"/>
        <path d="M11.2 14.6h5.6l-.6 22.2a2.2 2.2 0 0 1-2.2 2.1 2.2 2.2 0 0 1-2.2-2.1z" fill="url(#budSilver)"/>
        <path d="M14 17.5v17" stroke="#ffffff" stroke-width=".9" stroke-linecap="round" opacity=".9"/>
      </symbol>
      <symbol id="case-shape" viewBox="0 0 40 32">
        <rect x="2" y="12" width="36" height="18" rx="8" fill="url(#budSilver)"/>
        <rect x="2" y="2" width="36" height="17" rx="8" fill="url(#caseLid)" stroke="rgba(255,255,255,.5)" stroke-width=".8"/>
        <path d="M4 18.5h32" stroke="rgba(0,0,0,.35)" stroke-width=".8"/>
        <rect x="18" y="23.5" width="4" height="1.4" rx=".7" fill="#30d158"/>
      </symbol>
    </defs>
  </svg>
  <div id="notch">
  <div id="island">
    <!-- Collapsed: a circle with a clock icon; grows into a pill for media / running timers -->
    <div id="compact">
      <div id="c-inner">
        <div id="c-app"></div>
        <div id="c-battery" title="Battery">
          <svg viewBox="0 0 26 13" aria-hidden="true">
            <rect x="0.75" y="0.75" width="22" height="11.5" rx="3.2" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"/>
            <rect x="23.7" y="4.3" width="1.8" height="4.4" rx="0.9" fill="currentColor" fill-opacity="0.45"/>
            <rect id="c-batt-fill" x="2.4" y="2.4" width="18.7" height="8.2" rx="1.7"/>
            <path id="c-batt-bolt" d="M13.6 1.6 9.2 7.1h2.9l-1 4.3 4.5-5.6h-2.9z" fill="#000" stroke="#000" stroke-width="0.4"/>
          </svg>
          <span id="c-batt-pct">--%</span>
        </div>
        <svg id="c-clock" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 4.6V8l2.3 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div id="c-bars" class="viz"><i></i><i></i><i></i><i></i><i></i></div>
        <div id="c-timer"><span class="icon">&#xE916;</span><span id="c-timer-text">0:00</span></div>
      </div>
    </div>

    <!-- Expanded panel -->
    <div id="full">
      <header>
        <div id="big-time"><span id="hm">--:--</span><span id="sec">:--</span></div>
        <div id="date"><div id="day"></div><div id="date-line"></div></div>
      </header>

      <section id="buds" class="card" aria-label="Earbuds battery">
        <div class="buds-row">
          <div class="bud" data-part="left" title="Left earbud">
            <svg class="bud-img" viewBox="0 0 24 40" aria-hidden="true"><use href="#bud-shape"/></svg>
            <div class="bud-txt"><span class="bud-label">L</span><span class="bud-pct">—</span></div>
          </div>
          <div class="bud" data-part="right" title="Right earbud">
            <svg class="bud-img flip" viewBox="0 0 24 40" aria-hidden="true"><use href="#bud-shape"/></svg>
            <div class="bud-txt"><span class="bud-label">R</span><span class="bud-pct">—</span></div>
          </div>
          <div class="bud" data-part="case" title="Case">
            <svg class="case-img" viewBox="0 0 40 32" aria-hidden="true"><use href="#case-shape"/></svg>
            <div class="bud-txt"><span class="bud-label">Case</span><span class="bud-pct">—</span></div>
          </div>
        </div>
      </section>

      <section id="phones" class="card" aria-label="Headphones battery">
        <div class="phones-row">
          <img id="phones-img" class="phones-img" alt="" hidden>
          <svg id="phones-icon" class="phones-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-9 9v6a3 3 0 0 0 3 3h1a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1H5v-1a7 7 0 0 1 14 0v1h-2a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1a3 3 0 0 0 3-3v-6a9 9 0 0 0-9-9z" fill="currentColor"/></svg>
          <div class="phones-txt"><span id="phones-name" class="bud-label">Headphones</span><span id="phones-pct" class="bud-pct">—</span></div>
          <div class="phones-bar"><i id="phones-fill"></i></div>
        </div>
      </section>

      <section id="media" class="card">
        <div id="media-body">
          <div class="media-top">
            <div id="m-art" class="art"><span class="icon">&#xEC4F;</span></div>
            <div class="media-info">
              <div id="m-title"></div>
              <div id="m-artist"></div>
            </div>
            <div id="m-bars" class="viz"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div id="progress">
            <span id="p-elapsed">0:00</span>
            <div id="p-track" class="seek"><div class="track"><div id="p-fill"></div></div></div>
            <span id="p-remaining">-0:00</span>
          </div>
          <div class="controls">
            <button class="btn" data-cmd="prev" title="Previous"><span class="icon">&#xE892;</span></button>
            <button class="btn big" data-cmd="toggle" title="Play / pause"><span id="pp-icon" class="icon">&#xE768;</span></button>
            <button class="btn" data-cmd="next" title="Next"><span class="icon">&#xE893;</span></button>
          </div>
        </div>
        <div id="media-empty">Nothing playing</div>
      </section>

      <section id="timer" class="card">
        <button id="t-head" class="t-head" title="Timer">
          <span class="icon t-icon">&#xE916;</span>
          <span id="t-label">Timer</span>
          <span id="t-mini"></span>
          <span class="icon chev">&#xE70D;</span>
        </button>
        <div class="t-body"><div class="t-body-inner">
          <div class="timer-row">
            <button class="btn small" id="t-minus" title="-1 minute"><span class="icon">&#xE738;</span></button>
            <div id="t-display">5:00</div>
            <button class="btn small" id="t-plus" title="+1 minute"><span class="icon">&#xE710;</span></button>
          </div>
          <div id="t-presets">
            <button data-min="1">1m</button>
            <button data-min="5">5m</button>
            <button data-min="10">10m</button>
            <button data-min="15">15m</button>
            <button data-min="30">30m</button>
          </div>
          <div class="timer-controls">
            <button id="t-reset" class="pill secondary">Reset</button>
            <button id="t-start" class="pill primary">Start</button>
          </div>
        </div></div>
      </section>
    </div>
  </div>
  </div>
  <script src="visualizer.js"></script>
  <script src="timer.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
